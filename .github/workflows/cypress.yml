# .github/workflows/cypress.yml
name: Cypress Tests

on: [push, pull_request] # Runs on push and PRs

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Or your project’s Node version

      - name: Install dependencies
        run: npm install

      - name: Run Cypress tests
        run: npm run cy:run

      - name: Upload Cypress Videos (if test fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos

      - name: Upload Cypress Screenshots (if test fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
